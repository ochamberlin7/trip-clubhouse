<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Trip Clubhouse app icon: white serif "TC" monogram on solid navy, rounded
       square. Corner radius 112 ≈ 22% of 512. No transparency. -->
  <rect width="512" height="512" rx="112" ry="112" fill="#1B3F6E"/>
  <text x="256" y="256" fill="#FFFFFF"
        font-family="Georgia, 'Times New Roman', 'Playfair Display', serif"
        font-weight="700" font-size="248"
        text-anchor="middle" dominant-baseline="central"
        letter-spacing="-6">TC</text>
</svg>
